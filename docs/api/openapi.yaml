openapi: 3.0.3
info:
  title: TravelGen 生成管线 API
  description: >
    A侧（AI生成管线）对外契约 v0.1。成员A实现、成员B消费。
    异步任务模型：POST /api/v1/generate 提交，GET /api/v1/tasks/{task_id} 轮询。
    storyboard 结构遵循 docs/Storyboard_Schema_v1.md；评审结论见 docs/API_Contract_MVP.md。
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8000
    description: 本地开发（成员A管线服务）
  - url: https://mock.apifox.com
    description: Apifox Mock（前端先行开发）
tags:
  - name: 生成任务
    description: 视频生成任务（A侧）
  - name: 知识库
    description: 知识检索（可选能力，供前端知识点预览）
paths:
  /api/v1/generate:
    post:
      tags: [生成任务]
      operationId: createGenerateTask
      summary: 提交视频生成任务（异步）
      description: 校验参数后立即受理，返回 task_id；阶段输出通过任务查询接口轮询获取。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
            example:
              city: 杭州
              location: 西湖
              scene_type: 景区推荐
              theme: 春日西湖旅游宣传
              audience: 18-35岁年轻游客
              style: 大气唯美
              duration_s: 60
              aspect_ratio: '9:16'
              resolution: '1080p'
              description: 突出春日西湖风景、年轻人打卡体验
              assets:
                - type: image
                  url: https://images.example.com/xihu.jpg
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema:
                type: object
                required: [task_id, status]
                properties:
                  task_id:
                    type: string
                    example: t_20260813_ab12cd34
                  status:
                    $ref: '#/components/schemas/Status'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/tasks/{task_id}:
    get:
      tags: [生成任务]
      operationId: getGenerateTask
      summary: 查询任务状态与阶段输出
      parameters:
        - name: task_id
          in: path
          required: true
          description: 提交任务时返回的任务 ID
          schema:
            type: string
      responses:
        '200':
          description: 任务详情（阶段字段始终存在，未产生时为空对象/空数组）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateTask'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kb/search:
    get:
      tags: [知识库]
      operationId: searchKnowledgeBase
      summary: 知识库检索（可选，供前端"知识点"预览）
      parameters:
        - name: q
          in: query
          required: true
          description: 检索词（如"西湖"）
          schema:
            type: string
        - name: top_k
          in: query
          required: false
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: 检索结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/KbEntry'
components:
  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 任务不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: 模型额度/限速
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Status:
      type: string
      enum: [planning, copywriting, storyboard, generating, audio, composing, done, failed]
    AssetType:
      type: string
      enum: [image, video, audio]
    Asset:
      type: object
      required: [type, url]
      properties:
        type:
          $ref: '#/components/schemas/AssetType'
        url:
          type: string
          format: uri
          description: 参考素材地址（MVP 仅启用 image）
    GenerateRequest:
      type: object
      required: [city, location, scene_type, theme]
      properties:
        city:
          type: string
          example: 杭州
        location:
          type: string
          example: 西湖
        scene_type:
          type: string
          enum: [城市形象宣传, 景区推荐, 节庆活动推广, 非遗文化传播, 打卡视频, 其他]
        theme:
          type: string
          example: 春日西湖旅游宣传
        audience:
          type: string
          default: 18-35岁年轻游客
        style:
          type: string
          default: 大气唯美
        duration_s:
          type: integer
          default: 60
          minimum: 15
          maximum: 120
        aspect_ratio:
          type: string
          enum: ['9:16', '16:9', '1:1']
          default: '9:16'
        resolution:
          type: string
          enum: ['720p', '1080p']
          default: '1080p'
        video_model:
          type: string
          enum: ['seedance-2.0', 'seedance-2.0-pro']
          default: seedance-2.0-pro
          description: 视频模型（默认 Pro；模型 ID 映射在服务端配置）
        description:
          type: string
          description: 补充要求说明
        assets:
          type: array
          description: 参考素材（MVP 仅 image）
          items:
            $ref: '#/components/schemas/Asset'
    GenerateTask:
      type: object
      required: [task_id, status, progress]
      properties:
        task_id:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 阶段进度（done=100）
        message:
          type: string
          description: 进度说明；failed 时必填（失败阶段 + 原因）
        planning:
          type: object
          description: 内容策划大纲（3-5 段：引入/展开/高潮/收尾）
        copywriting:
          $ref: '#/components/schemas/Copywriting'
        script:
          $ref: '#/components/schemas/Script'
        storyboard:
          $ref: '#/components/schemas/Storyboard'
        visual_assets:
          $ref: '#/components/schemas/VisualAssets'
        voice:
          $ref: '#/components/schemas/Voice'
        music:
          $ref: '#/components/schemas/Music'
        video_clips:
          type: array
          description: 逐镜头视频片段（8 条）
          items:
            $ref: '#/components/schemas/VideoClip'
        safety:
          $ref: '#/components/schemas/Safety'
        final_video:
          $ref: '#/components/schemas/FinalVideo'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Copywriting:
      type: object
      properties:
        titles:
          type: array
          maxItems: 2
          items:
            type: string
          description: 2 个候选标题
        paragraphs:
          type: array
          description: 文案正文（4 段，含秒数）
          items:
            type: object
            required: [idx, text, duration_s]
            properties:
              idx:
                type: integer
              text:
                type: string
              duration_s:
                type: integer
        hashtags:
          type: array
          maxItems: 3
          items:
            type: string
          description: 3 个话题标签
    Script:
      type: object
      description: 配音稿/字幕稿（MVP 可作字幕；配音 Phase 5 接入）
      properties:
        lines:
          type: array
          items:
            type: object
            required: [line_id, text, start_s, end_s]
            properties:
              line_id:
                type: integer
              text:
                type: string
              start_s:
                type: integer
              end_s:
                type: integer
    Storyboard:
      type: object
      description: 分镜（严格遵循 docs/Storyboard_Schema_v1.md：全局 6-8 镜头，∑duration≈60s±5）
      required: [theme, scenes]
      properties:
        theme:
          type: string
        scenes:
          type: array
          items:
            type: object
            required: [scene_id, location, time, shot_list]
            properties:
              scene_id:
                type: integer
              location:
                type: string
              time:
                type: string
                enum: [清晨, 上午, 午后, 黄昏, 入夜]
              shot_list:
                type: array
                items:
                  type: object
                  required: [shot_id, duration_s, camera, shot_size, subject, background, prompt]
                  properties:
                    shot_id:
                      type: integer
                    duration_s:
                      type: integer
                    camera:
                      type: object
                      required: [type, movement, angle]
                      properties:
                        type:
                          type: string
                          enum: [航拍, 无人机, 固定机位, 地面机位, 移动机位]
                        movement:
                          type: string
                          enum: [固定, 推, 拉, 摇, 移, 跟, 升降, 环绕]
                        angle:
                          type: string
                          enum: [俯拍, 平拍, 仰拍, 侧拍]
                    shot_size:
                      type: string
                      enum: [大远景, 全景, 中景, 近景, 特写]
                    subject:
                      type: string
                    background:
                      type: string
                    prompt:
                      type: string
                      description: 可直接用于文生视频的完整提示词（含主体/环境/光线/质感）
    VisualAssets:
      type: object
      properties:
        kb_images:
          type: array
          description: 知识库视觉锚点图（首帧一致性/风格参考）
          items:
            type: object
            properties:
              name:
                type: string
              path:
                type: string
              url:
                type: string
              license:
                type: string
        ref_images:
          type: array
          description: 用户参考图（assets 传入，MVP 透传）
          items:
            type: string
    Voice:
      type: object
      description: 配音（Phase 5 接入，MVP 恒为空占位）
      properties:
        enabled:
          type: boolean
          default: false
        status:
          type: string
          default: reserved
        engine:
          type: string
          nullable: true
    Music:
      type: object
      description: 背景音乐建议（MVP 占位）
      properties:
        suggestions:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              style:
                type: string
              mood:
                type: string
        status:
          type: string
          default: reserved
    VideoClip:
      type: object
      required: [shot_id, status]
      properties:
        shot_id:
          type: integer
        task_id:
          type: string
          description: 视频平台任务 ID（火山方舟）
        status:
          type: string
          enum: [queued, running, succeeded, failed, expired]
        prompt:
          type: string
          description: 实际提交的镜头提示词
        video_url:
          type: string
          description: 视频地址（24h 有效，服务端成功即转存）
        duration_s:
          type: integer
        cost_yuan:
          type: number
          description: 单镜头成本估算
    Safety:
      type: object
      properties:
        passed:
          type: boolean
        checks:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [content, copyright, license]
              result:
                type: string
                enum: [pass, warn, fail]
              note:
                type: string
    FinalVideo:
      type: object
      description: 成片（B 合成后回填；MVP 状态 none）
      properties:
        status:
          type: string
          enum: [none, composing, ready, failed]
        url:
          type: string
          description: 成片地址（B 回填）
        preview_url:
          type: string
        duration_s:
          type: integer
        resolution:
          type: string
        aspect_ratio:
          type: string
        created_at:
          type: string
          format: date-time
    KbEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        city:
          type: string
        category:
          type: string
        facts:
          type: array
          items:
            type: string
        source:
          type: string
        verified:
          type: boolean
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: invalid_param
        message:
          type: string
        detail:
          type: string
